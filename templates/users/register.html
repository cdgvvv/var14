{% extends 'base.html' %}
{% block title %}Регистрация — QuestDark{% endblock %}

{% block content %}
<section class="section">
    <div class="container container--narrow">
        <h1>Регистрация</h1>
        <form method="post" id="register-form" class="card card--padded" novalidate>
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}:</label>
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn--accent btn--full">Создать аккаунт</button>
            <p class="form-footer">Уже есть аккаунт? <a href="{% url 'users:login' %}" class="link-accent">Войти</a></p>
        </form>
    </div>
</section>
{% endblock %}
