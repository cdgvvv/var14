{% extends 'base.html' %}
{% block title %}Вход — QuestDark{% endblock %}

{% block content %}
<section class="section">
    <div class="container container--narrow">
        <h1>Вход в аккаунт</h1>
        <form method="post" id="login-form" class="card card--padded" novalidate>
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert--error">Неверный логин или пароль.</div>
            {% endif %}
            <div class="form-group">
                <label for="id_username">Логин:</label>
                <input type="text" name="username" id="id_username" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="id_password">Пароль:</label>
                <input type="password" name="password" id="id_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn--accent btn--full">Войти</button>
            <p class="form-footer">Нет аккаунта? <a href="{% url 'users:register' %}" class="link-accent">Зарегистрироваться</a></p>
        </form>
    </div>
</section>
{% endblock %}
